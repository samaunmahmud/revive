<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>ReVive agent workflow: perceive, plan, act, verify, ask</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f7d2e"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0442b"/>
    </marker>
    <style>
      .n { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #a5651d; }
      .t { font-size: 17px; font-weight: 700; fill: #1d1915; }
      .s { font-size: 12.5px; fill: #3d3a35; }
      .xs { font-size: 11.5px; fill: #6d6a64; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #52514e; }
      .l { stroke: #52514e; stroke-width: 1.6; fill: none; }
      .g { stroke: #3f7d2e; stroke-width: 1.8; fill: none; }
      .r { stroke: #c0442b; stroke-width: 1.8; fill: none; }
      .lab { font-size: 11.5px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fcfbf8"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1d1915" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic">ReVive · agent workflow</text>
  <text x="40" y="68" class="s">Every decision is made from OpenCV 5 measurements, and every action is re-measured before it is kept. Each box writes to the trace.</text>

  <!-- 1 Perceive -->
  <rect x="40" y="110" width="250" height="190" rx="12" fill="#fff" stroke="#d9d4ca"/>
  <text x="58" y="136" class="n">01 · PERCEIVE</text>
  <text x="58" y="160" class="t">Measure damage</text>
  <text x="58" y="184" class="mono">scratch_coverage  median residual</text>
  <text x="58" y="200" class="mono">noise_sigma       Immerkaer</text>
  <text x="58" y="216" class="mono">black_point       1st pct of L</text>
  <text x="58" y="232" class="mono">highlight_cast    LAB a/b of top 10%</text>
  <text x="58" y="248" class="mono">contrast · sharpness</text>
  <text x="58" y="274" class="xs">+ damage mask (thin, long marks;</text>
  <text x="58" y="290" class="xs">  small round dust)</text>

  <!-- 2 Plan -->
  <rect x="340" y="110" width="270" height="190" rx="12" fill="#fff" stroke="#d9d4ca"/>
  <text x="358" y="136" class="n">02 · PLAN</text>
  <text x="358" y="160" class="t">Choose ONE next step</text>
  <text x="358" y="184" class="s">Heuristic planner (offline, default)</text>
  <text x="358" y="202" class="s">or LLM on Amazon Bedrock</text>
  <text x="358" y="224" class="xs">input: measurements + history + blocked tools</text>
  <text x="358" y="242" class="xs">order: colour → tones → scratches → grain</text>
  <text x="358" y="260" class="xs">LLM failure / invalid reply → heuristic</text>
  <text x="358" y="278" class="xs">output: tool + params · ask_human · done</text>

  <path class="l" d="M290 205 H336" marker-end="url(#a)"/>

  <!-- decision diamond -->
  <path d="M760 160 L830 205 L760 250 L690 205 Z" fill="#fff8ec" stroke="#e2a04f" stroke-width="1.4"/>
  <text x="760" y="201" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d1915">risky or</text>
  <text x="760" y="217" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d1915">ambiguous?</text>
  <path class="l" d="M610 205 H686" marker-end="url(#a)"/>

  <!-- 5 Ask -->
  <rect x="890" y="110" width="270" height="190" rx="12" fill="#fff8ec" stroke="#e2a04f" stroke-width="1.4"/>
  <text x="908" y="136" class="n">05 · ASK, DON'T GUESS</text>
  <text x="908" y="160" class="t">Pause that repair</text>
  <text x="908" y="184" class="s">cast with intact blacks:</text>
  <text x="908" y="200" class="xs">ageing, or the real scene colour?</text>
  <text x="908" y="222" class="s">damage mask &gt; 3% of photo:</text>
  <text x="908" y="238" class="xs">show the mask, approve before inpainting</text>
  <text x="908" y="260" class="xs">other repairs continue meanwhile</text>
  <text x="908" y="282" class="xs">answer → restore(img, answers={…})</text>
  <path class="l" d="M830 205 H886" marker-end="url(#a)"/>
  <text x="840" y="196" class="lab" fill="#a5651d">yes</text>

  <!-- 3 Act -->
  <rect x="620" y="360" width="280" height="170" rx="12" fill="#fff" stroke="#d9d4ca"/>
  <text x="638" y="386" class="n">03 · ACT (OPENCV 5)</text>
  <text x="638" y="410" class="t">Apply the repair</text>
  <text x="638" y="434" class="mono">correct_colour    LAB, keeps warmth</text>
  <text x="638" y="450" class="mono">enhance_contrast  stretch (+CLAHE)</text>
  <text x="638" y="466" class="mono">inpaint_scratches Telea / NS</text>
  <text x="638" y="482" class="mono">denoise           non-local means</text>
  <text x="638" y="498" class="mono">sharpen           unsharp mask</text>
  <path class="l" d="M760 250 V356" marker-end="url(#a)"/>
  <text x="768" y="300" class="lab" fill="#52514e">no: tool + params</text>

  <!-- 4 Verify -->
  <rect x="200" y="360" width="350" height="230" rx="12" fill="#fff" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="218" y="386" class="n" style="fill:#2a78d6">04 · VERIFY (RE-MEASURE)</text>
  <text x="218" y="410" class="t">Keep it only if</text>
  <text x="218" y="434" class="s">✓ its own target metric improved</text>
  <text x="218" y="454" class="s">✓ blurred SSIM structure ≥ floor</text>
  <text x="218" y="474" class="s">✓ contrast didn't create grain (≤ 1.15×)</text>
  <text x="218" y="494" class="s">✓ denoise didn't remove detail (≤ 1.3×)</text>
  <text x="218" y="520" class="xs">also logs damage the step REVEALED</text>
  <text x="218" y="536" class="xs">(e.g. stretching tones exposes hidden scratches),</text>
  <text x="218" y="552" class="xs">which the next plan then has to deal with</text>
  <path class="l" d="M620 445 H554" marker-end="url(#a)"/>

  <!-- kept loop back to perceive -->
  <path class="g" d="M200 430 H160 V304" marker-end="url(#ag)"/>
  <text x="58" y="340" class="lab" fill="#3f7d2e">kept → new measurements</text>
  <text x="58" y="356" class="lab" fill="#3f7d2e">change the next plan</text>

  <!-- rejected retry -->
  <path class="r" d="M375 590 V640 H475 V304" marker-end="url(#ar)"/>
  <text x="388" y="660" class="lab" fill="#c0442b">rejected → retry 40% gentler (max 2), then give up on that tool</text>

  <!-- done -->
  <rect x="890" y="380" width="270" height="130" rx="12" fill="#fff" stroke="#d9d4ca"/>
  <text x="908" y="406" class="n">DONE</text>
  <text x="908" y="430" class="t">Nothing left above threshold</text>
  <text x="908" y="454" class="xs">status: complete, or needs_human_review</text>
  <text x="908" y="470" class="xs">if questions are open or damage remains</text>
  <text x="908" y="492" class="xs">restored photo + full trace (JSON, S3)</text>
  <path class="l" d="M560 110 V92 H1180 V445 H1164" marker-end="url(#a)" opacity="0.55"/>
  <text x="572" y="86" class="xs">"done"</text>

  <!-- trace ribbon -->
  <rect x="40" y="690" width="1120" height="44" rx="10" fill="#f2ede4"/>
  <text x="58" y="717" class="s"><tspan font-weight="700">Trace</tspan> · every step records: measurements before/after, planner reason, params, target gain, structure, checks, revealed damage, verdict, ms; streamed live to the UI (SSE).</text>
</svg>
